name: Update player data

# Rebuilds data/players.json from nflverse. Injury reports change most days
# during the season, so this runs every six hours and commits only when the
# data changed.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_player_data.py
      - .github/workflows/update-data.yml

permissions:
  contents: write
  pages: write

concurrency: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build player data
        run: python3 scripts/build_player_data.py

      - name: Commit and republish if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/ && [ -z "$(git ls-files --others --exclude-standard data/)" ]; then
            echo "Data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update player data"
          git push
          # Pushes made with this job's token don't start other workflows, so ask
          # GitHub Pages to rebuild the site directly.
          gh api --method POST "repos/${{ github.repository }}/pages/builds"
